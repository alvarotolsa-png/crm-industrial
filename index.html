<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM Industrial — Ventas y Mantenimiento Pro</title>

<!-- PWA: Manifest y tema -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#185fa5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM Industrial">
<meta name="application-name" content="CRM Industrial">
<meta name="description" content="CRM para gestión de clientes, pipeline de ventas, actividades y cotizaciones industriales.">

<!-- Íconos -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeece8;--bg-info:#e6f1fb;--bg-warn:#faeeda;--bg-succ:#eaf3de;--bg-dang:#fcebeb;
    --tx:#1a1a1a;--tx2:#5f5e5a;--tx3:#9a9894;--tx-info:#185fa5;--tx-warn:#854f0b;--tx-succ:#3b6d11;--tx-dang:#a32d2d;
    --br:#e5e3de;--br2:#ccc9c2;--br3:#b0ada5;--rad:8px;--rad-lg:12px;
    --font:'Segoe UI',system-ui,sans-serif
  }
  body{font-family:var(--font);background:var(--bg2);color:var(--tx);font-size:14px;min-height:100vh}
  .app{max-width:1280px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
  /* NAV */
  nav{display:flex;align-items:center;gap:4px;padding:10px 18px;border-bottom:1px solid var(--br);background:var(--bg);flex-wrap:wrap;position:sticky;top:0;z-index:100}
  .nav-logo{font-size:14px;font-weight:600;color:var(--tx2);margin-right:8px;white-space:nowrap}
  .nb{padding:6px 13px;border:1px solid transparent;border-radius:var(--rad);background:transparent;cursor:pointer;font-size:13px;color:var(--tx2);font-family:var(--font);transition:all .15s}
  .nb:hover{background:var(--bg2)}.nb.active{background:var(--bg2);color:var(--tx);border-color:var(--br);font-weight:500}
  .nspc{flex:1}
  .bp{padding:7px 14px;background:var(--bg-info);color:var(--tx-info);border:1px solid #b5d4f4;border-radius:var(--rad);cursor:pointer;font-size:13px;font-family:var(--font);font-weight:500;transition:all .15s}
  .bp:hover{background:#d4e8f8}
  /* CONTENT */
  .cnt{padding:20px 18px;flex:1}
  .desk-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
  .sticky-tools{position:sticky;top:62px}
  .quick-actions{display:flex;gap:8px;flex-wrap:wrap}
  /* METRICS */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .mcard{background:var(--bg2);border-radius:var(--rad);padding:14px 16px}
  .mlbl{font-size:11px;color:var(--tx2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .mval{font-size:24px;font-weight:600;color:var(--tx)}
  .msub{font-size:11px;color:var(--tx3);margin-top:3px}
  /* CARDS */
  .card{background:var(--bg);border:1px solid var(--br);border-radius:var(--rad-lg);padding:14px 18px;margin-bottom:14px}
  .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ct{font-size:13px;font-weight:600;color:var(--tx)}
  /* BADGES */
  .bdg{display:inline-block;padding:2px 8px;border-radius:var(--rad);font-size:10px;font-weight:600}
  .b-prospecto,.b-pro{background:var(--bg-info);color:var(--tx-info)}
  .b-cliente,.b-cli{background:var(--bg-succ);color:var(--tx-succ)}
  .b-cartera{background:var(--bg2);color:var(--tx2)}
  .b-pendiente,.b-pen{background:var(--bg-warn);color:var(--tx-warn)}
  .b-completada,.b-com{background:var(--bg-succ);color:var(--tx-succ)}
  .b-enviada{background:#eeedfe;color:#534ab7}
  .b-borrador{background:var(--bg2);color:var(--tx2)}
  .b-aceptada{background:var(--bg-succ);color:var(--tx-succ)}
  .b-rechazada{background:var(--bg-dang);color:var(--tx-dang)}
  .ec0{background:#f1efe8;color:#5f5e5a}.ec1{background:var(--bg-info);color:var(--tx-info)}
  .ec2{background:#eeedfe;color:#534ab7}.ec3{background:var(--bg-warn);color:var(--tx-warn)}
  .ec4{background:var(--bg-succ);color:var(--tx-succ)}.ec5{background:#d0f0e0;color:#1a6636}.ec6{background:var(--bg-dang);color:var(--tx-dang)}
  /* LIST ROWS */
  .lrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--br);cursor:pointer;transition:background .1s}
  .lrow:hover{background:var(--bg2)}.lrow:last-child{border-bottom:none}
  .av{width:36px;height:36px;border-radius:50%;background:var(--bg-info);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tx-info);flex-shrink:0}
  /* KANBAN */
  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
  .kc{min-width:200px;flex-shrink:0}
  .kh{font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:6px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.3px}
  .kdash{font-size:11px;color:var(--tx3);margin-bottom:8px}
  .kcard{background:var(--bg);border:1px solid var(--br);border-radius:var(--rad);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .1s;position:relative}
  .kcard:hover{border-color:var(--br3)}
  .kct{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:3px;line-height:1.4;padding-right:20px}
  .kcs{font-size:11px;color:var(--tx2)}.kcv{font-size:12px;font-weight:600;color:var(--tx-info);margin-top:6px}
  /* FORMS & UI */
  .fg{margin-bottom:13px}
  .fl{font-size:12px;color:var(--tx2);margin-bottom:5px;display:block;font-weight:500}
  .fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .f-row{display:flex;gap:6px;align-items:center}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--br2);border-radius:var(--rad);background:var(--bg);color:var(--tx);font-size:13px;font-family:var(--font);outline:none;transition:border .1s}
  input:focus,select:focus,textarea:focus{border-color:#378add}
  textarea{height:72px;resize:vertical}
  .btn-del{background:none;border:none;color:var(--tx3);cursor:pointer;padding:4px;font-size:14px;transition:color .1s;border-radius:4px}
  .btn-del:hover{color:var(--tx-dang);background:var(--bg-dang)}
  .btn-icon{padding:6px 10px;border:1px solid var(--br2);border-radius:var(--rad);background:var(--bg2);cursor:pointer;font-size:14px}
  .btn-icon:hover{background:#e2e0db}
  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:40px 16px;overflow-y:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--bg);border-radius:var(--rad-lg);padding:22px;width:480px;max-width:100%;margin:auto}
  .mtit{font-size:15px;font-weight:600;margin-bottom:18px}
  .mac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--br)}
  .bc{padding:7px 14px;border:1px solid var(--br2);border-radius:var(--rad);background:transparent;cursor:pointer;font-size:13px;font-family:var(--font);color:var(--tx2)}
  .bc:hover{background:var(--bg2)}
  /* SEARCH & TABS */
  .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .stit{font-size:16px;font-weight:600}
  .sbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .sbar input{max-width:340px}.sbar select{width:auto;min-width:140px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .table-wrap{overflow:auto;border:1px solid var(--br);border-radius:var(--rad-lg);background:var(--bg)}
  .data-table{min-width:960px}
  .data-table th,.data-table td{padding:10px 12px;vertical-align:middle}
  .data-table th{position:sticky;top:0;background:var(--bg2);z-index:1}
  .data-table tbody tr{cursor:pointer}
  .data-table tbody tr:hover{background:var(--bg2)}
  .hint{font-size:11px;color:var(--tx3);line-height:1.5}
  .field-error{border-color:var(--tx-dang)!important;background:var(--bg-dang)!important}
  .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .mini-stat{background:var(--bg2);border-radius:var(--rad);padding:10px}
  .mini-stat b{display:block;font-size:16px;margin-top:2px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--br);margin-bottom:16px}
  .tab{padding:8px 16px;font-size:13px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--tx);border-bottom-color:var(--tx);font-weight:500}
  .tab:hover:not(.on){color:var(--tx)}
  .bk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--tx2);cursor:pointer;margin-bottom:16px;padding:5px 0}
  .bk:hover{color:var(--tx)}
  .pbar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
  .pbf{height:100%;border-radius:3px;background:#378add}
  /* ACT ICONS */
  .ai{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .ai-ll{background:#e6f1fb}.ai-vt{background:#eaf3de}.ai-co{background:#eeedfe}.ai-ms{background:#faeeda}.ai-re{background:#faece7}
  .empty{text-align:center;padding:32px 16px;color:var(--tx3);font-size:13px}
  .etq{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--br)}
  .alert{position:fixed;top:20px;right:20px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:var(--rad);font-size:13px;z-index:500;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 0;border-bottom:1px solid var(--br)}
  th{font-size:12px;color:var(--tx2);font-weight:500}
  @media(max-width:700px){
    .metrics{grid-template-columns:1fr 1fr}
    .fr{grid-template-columns:1fr}
    .desk-grid{grid-template-columns:1fr}
    .sticky-tools{position:static}
    .mini-grid{grid-template-columns:1fr}
    .kanban{flex-wrap:nowrap}
    nav{gap:2px}
    .nb{padding:5px 8px;font-size:12px}
  }
  @media print{nav,.mac,.bp,.nb,.bk,.etq,.btn-icon,.btn-del{display:none!important}.modal-bg{position:relative;background:none}.modal{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav-bar">
    <span class="nav-logo">⚙️ CRM Industrial</span>
    <button class="nb active" onclick="nav('dashboard')">Dashboard</button>
    <button class="nb" onclick="nav('clientes')">Clientes</button>
    <button class="nb" onclick="nav('pipeline')">Pipeline</button>
    <button class="nb" onclick="nav('oportunidades')">💼 Oportunidades</button>
    <button class="nb" onclick="nav('actividades')">Actividades</button>
    <button class="nb" onclick="nav('cotizaciones')">Cotizaciones</button>
    <button class="nb" onclick="nav('facturacion')">🧾 Facturación</button>
    <button class="nb" onclick="nav('comisiones')">💰 Comisiones</button>
    <button class="nb" onclick="nav('manual')">Manual técnico</button>
    <div class="nspc"></div>
    <span id="sync-indicator" style="font-size:11px;color:var(--tx3);padding:0 4px">⏳ Conectando...</span>
    <button class="nb" onclick="exportarDatos()" style="font-size:12px">⬇ Exportar</button>
  </nav>
  <div id="modal-layer" class="modal-bg" onclick="if(event.target===this)closeModal()"></div>
  <div class="cnt" id="view"></div>
</div>

<script>
// VARIABLES ESTATICAS
const ETAPAS=['Prospectación','Visita técnica','Cotización en proceso','Cotización enviada','Negociación','Cierre ganado','Cerrado perdido'];
const EC=['ec0','ec1','ec2','ec3','ec4','ec5','ec6'];
const ATYP=['Llamada','Visita técnica','Correo','Mensaje WhatsApp','Reunión','Cotización'];
const ACT_OTHER='Otra';
const ACT_OTHER_VALUE='__otra__';
const DEF_ATYP=[...ATYP,ACT_OTHER];
const AICO=['📞','🔧','📧','💬','🤝','📋','✏️'];
const ACL=['ai-ll','ai-vt','ai-co','ai-ms','ai-re','ai-co','ai-re'];

const DEF_SVCS=['Mantenimiento preventivo','Mantenimiento correctivo','Sistema aire acondicionado','Colector de polvos','Torre de enfriamiento','Filtros para colectores','Filtros HVAC','Canastillas para filtros','Válvulas pulse jet','Ventilación industrial HVAC','Otro'];
const DEF_IND=['Alimentos','Automotriz','Cementación','Química','Farmacéutica','Siderurgia','Textil','Minería','Petroquímica','Bebidas','Lácteos','Papel','Plástico','Retail','Otro'];
const DEF_ORI=['Referido','Llamada en frío','LinkedIn','Página web','Exposición industrial','Visita de campo','Correo directo','Otro'];

let st={view:'dashboard',cliId:null,tab:0,search:'',fTipo:'',fCartera:'',fActE:'pendiente',fActT:'',fCotE:'',fComE:'',fFacQ:''};
let db={C:[],O:[],A:[],Q:[],K:[],F:[],cfg:{}};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
const fmx=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n||0);
const fdt=d=>d?new Date(d+'T12:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'';
const ini=t=>(t||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const v=id=>document.getElementById(id);
const txt=s=>(s||'').toString().replace(/[\u0000-\u001F\u007F<>`]/g,'').trim();
const norm=s=>txt(s).toLowerCase();
const normalizeActivityTypes=arr=>{
  const clean=(Array.isArray(arr)?arr:DEF_ATYP).map(txt).filter(Boolean);
  if(!clean.some(x=>norm(x)===norm(ACT_OTHER)))clean.push(ACT_OTHER);
  return clean;
};
const activityTypes=()=>{
  if(!db.cfg)db.cfg={};
  db.cfg.atyp=normalizeActivityTypes(db.cfg.atyp);
  return db.cfg.atyp;
};
const activityCustomType=a=>txt(a?.tipoOtro||a?.tipoOtra||'');
const activityTypeIndex=a=>{
  const types=activityTypes();
  const raw=a?.tipo;
  if(raw!==undefined&&raw!==null&&raw!==''){
    const n=parseInt(raw,10);
    if(Number.isFinite(n))return n;
    const byLabel=types.findIndex(t=>norm(t)===norm(raw));
    if(byLabel>=0)return byLabel;
  }
  return 0;
};
const activityLabel=a=>{
  const custom=activityCustomType(a);
  if(custom)return custom;
  const types=activityTypes();
  const i=activityTypeIndex(a);
  return txt(types[i]||ATYP[i]||a?.tipo||'Actividad');
};
const activityIcon=a=>{
  const label=activityLabel(a);
  let i=activityTypeIndex(a);
  if(i<0||i>=AICO.length)i=ATYP.findIndex(t=>norm(t)===norm(label));
  if(i<0||i>=AICO.length)i=AICO.length-1;
  return{ico:AICO[i]||'✏️',cls:ACL[i]||'ai-re'};
};
const activityTypeOptions=(tipo=0,tipoOtro='')=>{
  const types=activityTypes();
  const custom=txt(tipoOtro);
  let selected=parseInt(tipo,10);
  if(!Number.isFinite(selected))selected=types.findIndex(t=>norm(t)===norm(tipo));
  const selectedLabel=types[selected]||'';
  const selectOther=!!custom||norm(selectedLabel)===norm(ACT_OTHER);
  return types.map((t,i)=>{
    const isOther=norm(t)===norm(ACT_OTHER);
    const val=isOther?ACT_OTHER_VALUE:String(i);
    const sel=(selectOther&&isOther)||(!selectOther&&i===selected);
    return`<option value="${esc(val)}" ${sel?'selected':''}>${esc(t)}</option>`;
  }).join('');
};
const money=n=>Math.max(0,parseFloat(n)||0);
const addUnique=(arr,val)=>{val=txt(val);if(val&&!arr.includes(val))arr.push(val);return val;};
const sumOtrosGastos=k=>(k.otrosGastos||[]).reduce((a,g)=>a+money(g.monto),0);
const facturaLigadaComision=k=>{
  const num=txt(k?.numFactura||'');
  if(!num)return null;
  const f=facturaByNumero(num);
  if(!f)return null;
  const emisorFactura=txt(f.emisorFactura||f.emisor||'');
  return{
    factura:f,
    numFactura:txt(f.numFactura||num),
    fechaFactura:txt(f.fecha||''),
    razonSocial:emisorFactura,
    montoFacturado:money(f.totalFacturado)||facturaTotal(f)
  };
};
const comisionConFacturaVinculada=k=>{
  if(!k)return k;
  const vinculo=facturaLigadaComision(k);
  if(!vinculo)return k;
  return{
    ...k,
    numFactura:vinculo.numFactura,
    fechaFactura:vinculo.fechaFactura,
    razonSocial:vinculo.razonSocial,
    montoFacturado:vinculo.montoFacturado
  };
};
const calcComision=k=>{
  const c=comisionConFacturaVinculada(k||{});
  const monto=money(c.montoFacturado), compra=money(c.precioCompra);
  const fletes=money(c.fleteComercializador)+money(c.fleteComprador);
  const otros=sumOtrosGastos(c);
  const utilidad=monto-compra-fletes-otros;
  const pct=parseFloat(c.pctComision)||0;
  return{monto,compra,fletes,otros,utilidad,pct,comision:utilidad*(pct/100)};
};
const emisorComision=k=>txt(comisionConFacturaVinculada(k)?.razonSocial)||'__sin_emisor__';
const labelEmisorComision=emisor=>emisor==='__sin_emisor__'?'Sin emisor capturado':emisor;
const fichasComisionFiltradas=()=>{
  const filtro=st.fComE||'';
  return filtro?db.K.filter(k=>emisorComision(k)===filtro):db.K;
};
const clienteComision=k=>{
  const q=byId(db.Q,k.cotId)||{};
  const c=byId(db.C,k.cliId||q.cliId)||{};
  const contacto=txt(k.clienteCotizacion||q.contacto||c.nombre);
  const empresa=txt(k.empresaCotizacion||c.empresa);
  const texto=contacto&&empresa&&contacto!==empresa?`${contacto} · ${empresa}`:(contacto||empresa||'Sin cliente capturado');
  return{contacto,empresa,texto};
};
const cfgOptions=(key,current='')=>{
  const cur=txt(current);
  const arr=Array.isArray(db.cfg?.[key])?[...db.cfg[key]]:[];
  if(cur&&!arr.includes(cur))arr.unshift(cur);
  return arr.map(x=>{x=txt(x);return`<option value="${esc(x)}" ${x===cur?'selected':''}>${esc(x)}</option>`;}).join('');
};
const intn=(n,min=0)=>Math.max(min,parseInt(n)||min);
const isEmail=s=>!s||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
const isPhone=s=>!s||/^[0-9\s()+.-]{7,25}$/.test(s);
const byId=(arr,id)=>arr.find(x=>x.id===id);
const cotSubtotal=q=>(q.items||[]).reduce((s,i)=>s+(money(i.qty)*money(i.precio)),0);
const clienteTexto=c=>[c.nombre,c.empresa,c.tel,c.email,c.industria,c.origen,c.servicio,c.ubicacion,c.cartera].map(norm).join(' ');
const setInvalid=(el,bad)=>{if(el)el.classList.toggle('field-error',!!bad);return !bad;};
const getVal=id=>txt(v(id)?.value||'');
const dtLocal=(fecha,hora)=>new Date(`${fecha||today()}T${hora||'09:00'}:00`);
const gcalDate=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const googleCalendarUrl=a=>{
  const c=byId(db.C,a.cliId)||{};
  const o=byId(db.O,a.oppId)||{};
  const ini=dtLocal(a.fecha,a.hora);
  const fin=new Date(ini.getTime()+60*60*1000);
  const details=[
    a.titulo,
    c.empresa?`Empresa: ${c.empresa}`:'',
    c.nombre?`Contacto: ${c.nombre}`:'',
    c.tel?`Tel: ${c.tel}`:'',
    c.email?`Email: ${c.email}`:'',
    o.titulo?`Oportunidad: ${o.titulo}`:''
  ].filter(Boolean).join('\n');
  const p=new URLSearchParams({action:'TEMPLATE',text:a.titulo||'Actividad CRM',dates:`${gcalDate(ini)}/${gcalDate(fin)}`,details,location:c.ubicacion||''});
  return `https://calendar.google.com/calendar/render?${p.toString()}`;
};
const openCalendar=id=>{const a=byId(db.A,id);if(a)window.open(googleCalendarUrl(a),'_blank','noopener');};

const whatsappUrl=tel=>{

const contactFileName=c=>`${txt(c.empresa||c.nombre||'contacto').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]+/g,'_')||'contacto'}.vcf`;
function clienteVcard(c){
  const nombre=txt(c.nombre||c.empresa||'Contacto CRM');
  // Separar en partes para el campo N (requerido por Android para buscar por nombre)
  const partes=nombre.trim().split(/\s+/);
  const primerNombre=partes[0]||nombre;
  const apellido=partes.length>1?partes.slice(1).join(' '):'';
  const note=[
    'CRM Industrial',
    c.tipo?`Tipo: ${c.tipo}`:'',
    c.cartera?`Cartera: ${c.cartera}`:'',
    c.industria?`Industria: ${c.industria}`:'',
    c.servicio?`Servicio: ${c.servicio}`:'',
    c.origen?`Origen: ${c.origen}`:''
  ].filter(Boolean).join(' | ');
  return[
    'BEGIN:VCARD',
    'VERSION:3.0',
    // Campo N es obligatorio para que Android indexe y busque el contacto por nombre
    `N:${vcfEscape(apellido)};${vcfEscape(primerNombre)};;;`,
    `FN:${vcfEscape(nombre)}`,
    c.empresa?`ORG:${vcfEscape(c.empresa)}`:'',
    c.tel?`TEL;TYPE=CELL:${vcfEscape(c.tel)}`:'',
    c.email?`EMAIL;TYPE=INTERNET:${vcfEscape(c.email)}`:'',
    c.ubicacion?`ADR;TYPE=WORK:;;${vcfEscape(c.ubicacion)};;;;`:'',
    note?`NOTE:${vcfEscape(note)}`:'',
    'END:VCARD'
  ].filter(Boolean).join('\r\n')+'\r\n';
}
async function guardarContactoAndroid(id){
  const c=byId(db.C,id);
  if(!c){toast('Cliente no encontrado');return;}
  const vcard=clienteVcard(c);
  const filename=contactFileName(c);
  const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
  let file=null;
  try{file=new File([blob],filename,{type:'text/vcard;charset=utf-8'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:txt(c.nombre||c.empresa||'Contacto CRM'),text:'Contacto CRM Industrial'});
      toast('✓ Contacto listo para guardar en Android');
      return;
    }catch(e){
      if(e&&e.name==='AbortError')return;
    }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
  toast('✓ Archivo .vcf descargado para importar en Contactos');
}

function normalizeDb(data) {
  const d = data || {};
  d.C = Array.isArray(d.C) ? d.C : [];
  d.O = Array.isArray(d.O) ? d.O : [];
  d.A = Array.isArray(d.A) ? d.A : [];
  d.Q = Array.isArray(d.Q) ? d.Q : [];
  d.K = Array.isArray(d.K) ? d.K : [];
  d.F = Array.isArray(d.F) ? d.F : [];
  if (!d.cfg || typeof d.cfg!=='object') d.cfg = {};
  d.cfg.svcs  = Array.isArray(d.cfg.svcs) ? d.cfg.svcs : DEF_SVCS.slice();
  d.cfg.ind   = Array.isArray(d.cfg.ind) ? d.cfg.ind : DEF_IND.slice();
  d.cfg.ori   = Array.isArray(d.cfg.ori) ? d.cfg.ori : DEF_ORI.slice();
  d.cfg.atyp  = normalizeActivityTypes(d.cfg.atyp);
  d.cfg.gastos = Array.isArray(d.cfg.gastos) ? d.cfg.gastos : ['Gasolina','Alimentos','Casetas','Estacionamiento','Papelería','Viáticos'];
  d.cfg.razonesSociales = Array.isArray(d.cfg.razonesSociales) ? d.cfg.razonesSociales : [];
  d.cfg.proveedores = Array.isArray(d.cfg.proveedores) ? d.cfg.proveedores : [];
  d.cfg.proveedoresServicios = Array.isArray(d.cfg.proveedoresServicios) ? d.cfg.proveedoresServicios : [];
  d.cfg.carteras = Array.isArray(d.cfg.carteras) ? d.cfg.carteras : [];
  d.cfg.clientesFactura = Array.isArray(d.cfg.clientesFactura) ? d.cfg.clientesFactura : [];
  d.cfg.emisoresFactura = Array.isArray(d.cfg.emisoresFactura) ? d.cfg.emisoresFactura : [];
  d.cfg.conceptosFactura = Array.isArray(d.cfg.conceptosFactura) ? d.cfg.conceptosFactura : DEF_SVCS.slice();
  d.C.forEach(c=>{
    c.cartera=txt(c.cartera||'');
    addUnique(d.cfg.carteras,c.cartera);
  });
  d.K.forEach(k=>{
    addUnique(d.cfg.razonesSociales,k.razonSocial);
    addUnique(d.cfg.proveedores,k.proveedor);
    addUnique(d.cfg.proveedoresServicios,k.fleteComercializadorProv);
    addUnique(d.cfg.proveedoresServicios,k.fleteCompradorProv);
    (k.otrosGastos||[]).forEach(g=>addUnique(d.cfg.proveedoresServicios,g.proveedor));
  });
  (d.cfg.razonesSociales||[]).forEach(rs=>addUnique(d.cfg.emisoresFactura,rs));
  d.F.forEach(f=>{
    if(!txt(f.emisorFactura||''))f.emisorFactura=txt(f.emisor||'');
    if(!txt(f.emisor||''))f.emisor=txt(f.emisorFactura||'');
    if(!txt(f.clienteFacturado||''))f.clienteFacturado='';
    const emisorFactura=txt(f.emisorFactura||f.emisor||'');
    const clienteFacturado=txt(f.clienteFacturado||'');
    addUnique(d.cfg.razonesSociales,emisorFactura);
    addUnique(d.cfg.emisoresFactura,emisorFactura);
    addUnique(d.cfg.clientesFactura,clienteFacturado);
    (f.partidas||[]).forEach(p=>addUnique(d.cfg.conceptosFactura,p.concepto));
  });
  return d;
}

function save() {
  // Guardar localmente siempre (para offline)
  try { localStorage.setItem('crm_industrial_v3', JSON.stringify(db)); } catch(e) {}
  // Subir a Firestore
  if (!firestore) return;
  setSyncStatus('syncing');
  skipNextSnapshot = true;
  firestoreDoc().set({
    C: db.C, O: db.O, A: db.A, Q: db.Q, K: db.K, F: db.F, cfg: db.cfg,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => setSyncStatus('online'))
  .catch(err => { console.warn('[Firebase] Error al guardar:', err); setSyncStatus('offline'); skipNextSnapshot = false; });
}

function load() {
  try { const r = localStorage.getItem('crm_industrial_v3'); if (r) db = JSON.parse(r); } catch(e) {}
  db = normalizeDb(db);
}

function initFirebaseSync() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    firestore = firebase.firestore();
    // Escuchar cambios en tiempo real
    firestoreDoc().onSnapshot(doc => {
      if (skipNextSnapshot) { skipNextSnapshot = false; setSyncStatus('online'); return; }
      if (doc.exists) {
        let prevF=[];
        try{const raw=localStorage.getItem('crm_industrial_v3');if(raw)prevF=normalizeDb(JSON.parse(raw)).F||[];}catch(e){}
        let remoto=normalizeDb(doc.data());
        if((!remoto.F||remoto.F.length===0)&&prevF.length>0)remoto.F=prevF;
        db=remoto;
        try { localStorage.setItem('crm_industrial_v3', JSON.stringify(db)); } catch(e) {}
        nav(st.view); // Re-renderizar la vista actual
        setSyncStatus('online');
      } else {
        // Primera vez: subir datos locales si hay alguno
        if (db.C.length || db.O.length || db.A.length || db.Q.length) save();
        else setSyncStatus('online');
      }
    }, err => { console.warn('[Firebase] Sync error:', err); setSyncStatus('offline'); });
  } catch(e) {
    console.warn('[Firebase] No se pudo inicializar:', e);
    setSyncStatus('offline');
  }
}

function renderComisiones(){
  const ganadas=db.O.filter(o=>o.etapa===5);
  const emisores=[...new Set(db.K.map(emisorComision))].sort((a,b)=>labelEmisorComision(a).localeCompare(labelEmisorComision(b),'es'));
  if(st.fComE&&!emisores.includes(st.fComE))st.fComE='';
  const fichas=fichasComisionFiltradas();
  const totalFichas=db.K.length;
  const filtroActivo=!!st.fComE;
  // Totales generales
  const totales=fichas.reduce((acc,k)=>{
    const r=calcComision(k);
    acc.facturado+=r.monto;acc.utilidad+=r.utilidad;acc.comision+=r.comision;
    return acc;
  },{facturado:0,utilidad:0,comision:0});
  const totalFacturado=totales.facturado;
  const totalUtilidad=totales.utilidad;
  const totalComision=totales.comision;

  if(totalFichas===0){
    return`<div class="sh"><span class="stit">💰 Comisiones</span><div class="toolbar"><button class="bp" onclick="modal('nueva-comision-manual')" style="font-size:12px">+ Nueva ficha manual</button><button class="nb" onclick="exportarComisiones()" style="font-size:12px">⬇ Exportar Excel</button></div></div>
    <div class="empty" style="margin-top:40px">
      <div style="font-size:48px;margin-bottom:12px">💰</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:8px">Sin comisiones aún</div>
      <div class="hint">Las fichas se generan al marcar una oportunidad como <b>Cierre ganado</b> con cotizaciones, o puedes crear una <b>ficha manual</b>.</div>
    </div>`;
  }

  // Agrupar por oportunidad
  const grupos=ganadas.map(o=>{
    const c=db.C.find(x=>x.id===o.cliId);
    const ks=fichas.filter(k=>k.oppId===o.id);
    return{o,c,ks};
  }).filter(g=>g.ks.length>0);
  const emisorOpts=emisores.map(e=>`<option value="${esc(e)}" ${st.fComE===e?'selected':''}>${esc(labelEmisorComision(e))}</option>`).join('');

  return`
  <div class="sh">
    <span class="stit">💰 Comisiones <span style="font-weight:400;color:var(--tx2);font-size:14px">(${fichas.length}${filtroActivo?` de ${totalFichas}`:''} fichas)</span></span>
    <div class="toolbar">
      <select onchange="st.fComE=this.value;render()" title="Filtrar por razón social del emisor" style="min-width:220px">
        <option value="">Todos los emisores</option>${emisorOpts}
      </select>
      ${filtroActivo?`<button class="bc" onclick="st.fComE='';render()" style="font-size:12px">Limpiar</button>`:''}
      <button class="bp" onclick="modal('nueva-comision-manual')" style="font-size:12px">+ Nueva ficha manual</button>
      <button class="nb" onclick="exportarComisiones()" style="font-size:12px">⬇ Exportar Excel</button>
    </div>
  </div>
  <div class="desk-grid">
    <div>
      ${(()=>{
        const otrasFichas=fichas.filter(k=>{
          const o=k.oppId&&k.oppId!=='__manual__'?byId(db.O,k.oppId):null;
          return!o||o.etapa!==5;
        });
        const hayGrupos=grupos.some(g=>g.ks.length>0);
        const vacio=!hayGrupos&&!otrasFichas.length;
        return(vacio?`<div class="empty">${filtroActivo?`Sin fichas de comisión para ${esc(labelEmisorComision(st.fComE))}`:'Sin fichas de comisión visibles'}</div>`:'')+
      grupos.map(({o,c,ks})=>ks.length?`
      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--br)">
          <div class="av" style="background:var(--succ);color:#fff">🏆</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:14px">${esc(o.titulo)}</div>
            <div class="hint">${c?esc(c.empresa):''} · Cierre ganado</div>
          </div>
        </div>
        ${ks.map(k=>htmlComisionFichaCard(k)).join('')}
      </div>`:'').join('')+
      (otrasFichas.length?`
      <div class="card" style="margin-bottom:14px;border-left:3px solid #8b7355">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--br)">
          <div class="av" style="background:#e8dcc8;color:#5c4a32">📎</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:14px">Fichas manuales u otras</div>
            <div class="hint">Sin oportunidad ganada vinculada, u oportunidad ya no está en “Cierre ganado”</div>
          </div>
        </div>
        ${otrasFichas.map(k=>htmlComisionFichaCard(k)).join('')}
      </div>`:'');
      })()}
    </div>
    <div class="sticky-tools">
      <div class="card">
        <div class="ct" style="margin-bottom:10px">Resumen ${filtroActivo?'del emisor':'total'}</div>
        ${filtroActivo?`<div class="hint" style="margin-bottom:8px">${esc(labelEmisorComision(st.fComE))}</div>`:''}
        <div class="mini-grid">
          <div class="mini-stat"><span class="hint">Fichas</span><b>${fichas.length}</b></div>
          <div class="mini-stat"><span class="hint">Facturado</span><b>${fmx(totalFacturado)}</b></div>
          <div class="mini-stat"><span class="hint">Utilidad total</span><b style="color:${totalUtilidad>=0?'var(--tx-succ)':'var(--tx-dang)'}">${fmx(totalUtilidad)}</b></div>
          <div class="mini-stat"><span class="hint" style="color:#3b6d11">Total comisiones</span><b style="color:#3b6d11;font-size:16px">${fmx(totalComision)}</b></div>
        </div>
      </div>
      <div class="card" style="margin-top:10px">
        <div class="ct" style="margin-bottom:8px">⚙️ Gastos frecuentes</div>
        <div class="hint" style="margin-bottom:8px">Personaliza la lista de "Otros gastos"</div>
        <div style="max-height:180px;overflow-y:auto">
          ${(db.cfg.gastos||[]).map((g,i)=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--br);font-size:13px">
            <span>${esc(g)}</span>
            <button class="bc" style="padding:2px 6px;font-size:11px" onclick="eliminarGasto(${i})">✕</button>
          </div>`).join('')}
        </div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <input type="text" id="nuevo-gasto" placeholder="Nuevo concepto..." style="flex:1;font-size:12px">
          <button class="bp" style="font-size:12px;padding:6px 10px" onclick="agregarGasto()">+</button>
        </div>
      </div>
    </div>
  </div>`;
}

function agregarGasto(){
  const inp=v('nuevo-gasto');
  const val=txt(inp.value);
  if(!val){toast('Escribe un concepto');return;}
  if(!db.cfg.gastos)db.cfg.gastos=[];
  if(db.cfg.gastos.includes(val)){toast('Ya existe ese concepto');return;}
  db.cfg.gastos.push(val);
  save();render();
}
function eliminarGasto(i){
  db.cfg.gastos.splice(i,1);
  save();render();
}
function eliminarOtroGasto(kId,gi){
  const k=db.K.find(x=>x.id===kId);
  if(k){capturarDraftComision(k);k.otrosGastos.splice(gi,1);save();modal('editar-comision',kId);}
}

function exportarComisiones(){
  if(typeof XLSX==='undefined'){toast('⚠ Cargando librería, intenta en unos segundos...');return;}
  const wb=XLSX.utils.book_new();
  const rows=fichasComisionFiltradas().map(k=>{
    const kc=comisionConFacturaVinculada(k);
    const o=db.O.find(x=>x.id===k.oppId)||{};
    const c=db.C.find(x=>x.id===k.cliId)||{};
    const r=calcComision(kc);
    const cliCot=clienteComision(k);
    return{
      'Cliente':c.empresa||'',
      'Cliente Cotización':cliCot.contacto||cliCot.empresa||'',
      'Empresa Cotización':cliCot.empresa||'',
      'Oportunidad':o.titulo||'',
      'No. Cotización':k.numCot||'',
      'Fecha Cotización':k.fechaCot||'',
      'Subtotal Cotización':k.subtotalCot||0,
      'No. Factura':kc.numFactura||'',
      'Razón Social Emisor':kc.razonSocial||'',
      'Monto Facturado':kc.montoFacturado||0,
      'Fecha Factura':kc.fechaFactura||'',
      'Proveedor':k.proveedor||'',
      'Precio de Compra':k.precioCompra||0,
      'Flete a Comercializador':k.fleteComercializador||0,
      'Proveedor Flete Comercializador':k.fleteComercializadorProv||'',
      'Flete a Comprador Final':k.fleteComprador||0,
      'Proveedor Flete Comprador Final':k.fleteCompradorProv||'',
      'Otros Gastos':( k.otrosGastos||[]).map(g=>`${g.concepto}${g.proveedor?` (${g.proveedor})`:''}: $${g.monto}`).join(' | '),
      'Total Otros Gastos':r.otros,
      '% Comisión':k.pctComision||0,
      'Utilidad':r.utilidad,
      'Comisión':r.comision
    };
  });
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{}]);
  XLSX.utils.book_append_sheet(wb,ws,'Comisiones');
  const filtro=st.fComE?('_'+labelEmisorComision(st.fComE).replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]+/g,'_')):'';
  XLSX.writeFile(wb,'Comisiones'+filtro+'_'+today()+'.xlsx');
  toast('✓ Excel de comisiones exportado');
}

async function importarContactos(){
  // Verificar soporte del navegador
  if(!('contacts' in navigator && 'ContactsManager' in window)){
    toast('⚠️ Esta función solo está disponible en Chrome para Android');
    return;
  }
  try {
    // Detectar propiedades disponibles en este dispositivo
    let propsDisponibles = ['name','tel','email'];
    try {
      const soportadas = await navigator.contacts.getProperties();
      if(soportadas.includes('organization')) propsDisponibles.push('organization');
    } catch(e2) {}
    const opts = { multiple: true };
    const contactos = await navigator.contacts.select(propsDisponibles, opts);
    if(!contactos || contactos.length === 0){
      toast('No se seleccionó ningún contacto');
      return;
    }
    let agregados = 0, duplicados = 0;
    contactos.forEach(c => {
      const nombre  = (c.name    && c.name[0])         || '';
      const tel     = (c.tel     && c.tel[0])           || '';
      const email   = (c.email   && c.email[0])         || '';
      const empresa = (c.organization && c.organization[0]) || nombre;
      // Evitar duplicados por teléfono o email
      const existe = db.C.find(x =>
        (tel   && x.tel   === tel)   ||
        (email && x.email === email)
      );
      if(existe){ duplicados++; return; }
      // Requiere al menos nombre y teléfono
      if(!nombre && !tel){ return; }
      db.C.push({
        id:       uid(),
        nombre:   nombre,
        empresa:  empresa || nombre,
        tel:      tel,
        email:    email,
        ubicacion:'',
        industria:'',
        cartera:  '',
        tipo:     'prospecto',
        origen:   'Agenda',
        servicio: '',
        creado:   today()
      });
      agregados++;
    });
    save();
    render();
    if(duplicados > 0)
      toast(`✓ ${agregados} contacto(s) importado(s) · ${duplicados} ya existían`);
    else
      toast(`✓ ${agregados} contacto(s) importado(s) correctamente`);
  } catch(e) {
    if(e.name === 'SecurityError')
      toast('⚠️ Permiso denegado para acceder a los contactos');
    else
      toast('⚠️ No se pudo acceder a los contactos: ' + e.message);
  }
}

function facturaTotal(f){
  if(!f)return 0;
  const total=money(f.totalFacturado);
  if(total>0)return total;
  return (f.partidas||[]).reduce((s,p)=>s+money(p.total),0);
}
function facturaNumNormLoose(s){
  return norm(s).replace(/\s+/g,'').replace(/[-_/]/g,'');
}
function facturaByNumero(num){
  const lista=db.F||[];
  const n=norm(num);
  if(!n)return null;
  const nf=x=>norm(String(x.numFactura??''));
  let f=lista.find(x=>nf(x)===n);
  if(f)return f;
  const loose=facturaNumNormLoose(num);
  if(loose)f=lista.find(x=>facturaNumNormLoose(String(x.numFactura??''))===loose);
  if(f)return f;
  const hasLetters=/[a-záéíóúñ]/i.test(String(num));
  const digits=String(num).replace(/\D/g,'');
  if(!hasLetters&&digits.length>=4)f=lista.find(x=>String(x.numFactura??'').replace(/\D/g,'')===digits);
  if(f)return f;
  if(hasLetters&&digits.length>=2){
    const pref=String(num).replace(/\s/g,'').match(/^([^\d]*)(\d.*)$/);
    if(pref)f=lista.find(x=>{
      const s=String(x.numFactura??'').replace(/\s/g,'');
      const m=s.match(/^([^\d]*)(\d.*)$/);
      return m&&norm(pref[1])===norm(m[1])&&pref[2].replace(/\D/g,'')===m[2].replace(/\D/g,'');
    });
  }
  return f||null;
}
function facturasDisponiblesParaComision(kId){
  const actual=db.K.find(x=>x.id===kId)||{};
  const actualFactura=facturaByNumero(actual.numFactura||'');
  const actualFacturaId=actualFactura?.id||'';
  const usadas=new Set();
  (db.K||[]).forEach(k=>{
    if(!k||k.id===kId)return;
    const f=facturaByNumero(k.numFactura||'');
    if(f?.id)usadas.add(f.id);
  });
  return (db.F||[])
    .filter(f=>f?.id&&(!usadas.has(f.id)||f.id===actualFacturaId))
    .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||norm(a.numFactura).localeCompare(norm(b.numFactura)));
}
function optionsFacturasComision(kId,current=''){
  const cur=txt(current);
  const opciones=facturasDisponiblesParaComision(kId);
  const vals=new Set();
  const rows=opciones.map(f=>{
    const num=txt(f.numFactura||'');
    if(!num)return'';
    const emisor=txt(f.emisorFactura||f.emisor||'Sin emisor');
    const fecha=txt(f.fecha||'');
    const monto=money(f.totalFacturado)||facturaTotal(f);
    const label=`${num} — ${emisor} — ${fecha?fdt(fecha):'Sin fecha'} — ${fmx(monto)}`;
    vals.add(norm(num));
    return`<option value="${esc(num)}" data-fid="${esc(f.id||'')}" data-fecha="${esc(fecha)}" data-emisor="${esc(emisor)}" data-monto="${esc(String(monto))}" ${norm(num)===norm(cur)?'selected':''}>${esc(label)}</option>`;
  }).join('');
  let extra='';
  if(cur&&!vals.has(norm(cur))){
    extra=`<option value="${esc(cur)}" selected>${esc(cur)} (actual)</option>`;
  }
  return`${extra}${rows}`;
}
function fechaInputISO(vl){
  if(!vl)return'';
  const t=txt(String(vl));
  if(!t)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
  const m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    const y=m[3].length===2?`20${m[3]}`:m[3];
    return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  const d=new Date(t);
  if(Number.isNaN(d.getTime()))return'';
  return d.toISOString().slice(0,10);
}

function normalizeExcelHeader(h){
  return txt(h).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
/** Encabezados equivalentes (sin acentos ni símbolos) → el CRM acepta varias convenciones, p. ej. exportaciones de Ohana / CFDI. */
const FAC_COL_ALIASES={
  numerodefactura:['numerodefactura','numerofactura','nofactura','nodefactura','ndefactura','factura','foliofactura','foliodefactura','foliofiscal','uuid','foliouuid','serie','folio','numerofolio'],
  clientefacturado:['clientefacturado','cliente','clienterazonsocial','nombrecliente','razonsocialcliente','clientefiscal','clientefactura','razonsocialclientefacturado'],
  emisorfactura:['emisorfactura','emisor','razonsocialemisor','razonsocialemisora','nombreemisor','empresaemisor','proveedoremisor','rfcemisor'],
  emisor:['emisor','cliente','clienterazonsocial','nombrecliente','razonsocialcliente','razonsocial','razonsocialemisor','razonsocialemisora','nombreemisor','empresaemisor','proveedoremisor','nombreproveedor','proveedor','rfcemisor','rfc'],
  fecha:['fecha','fechafactura','fechadefactura','fechaemision','fechaemisión','fechatimbrado'],
  conceptoproductoservicio:['conceptoproductoservicio','concepto','descripcion','descripciondelproducto','descripcionproducto','productoservicio','producto/servicio','item','detalle','conceptodelbien','claveprod','claveproducto','claveproductoservicio'],
  preciounitario:['preciounitario','preciounit','punitario','pu','preciounitariomxn','preciounitariopesos','valorunitario','preciodeventa','punit','preciounitario'],
  cantidad:['cantidad','qty','cant','piezas','unidades','noartículos','noarticulos'],
  totalpartida:['totalpartida','importepartida','importelinea','importeline','totallinea','subtotalpartida','montopartida','importe','subtotal'],
  totalfacturado:['totalfacturadoconiva','totalfacturadoiva','totalfacturadosiniva','totalfacturado','totalfactura','totaldocumento','importetotal','montototal','total','totalapagar','totalconimpuestos','totalpesos','totalconiva']
};
function resolveFacImportColumnMap(sampleRow){
  const keys=Object.keys(sampleRow||{});
  const byNorm={};
  keys.forEach(k=>{if(txt(k))byNorm[normalizeExcelHeader(k)]=k;});
  const map={};
  for(const [logical,aliases] of Object.entries(FAC_COL_ALIASES)){
    for(const a of aliases){
      if(byNorm[a]!==undefined){map[logical]=byNorm[a];break;}
    }
  }
  return map;
}
function facCell(raw,map,logical){
  const k=map[logical];
  if(!k||raw[k]===undefined||raw[k]===null)return '';
  return raw[k];
}
function validateFacImportMap(map){
  const miss=[];
  const labels={numerodefactura:'No. Factura (o folio / UUID)',emisor:'Cliente facturado o Emisor (razón social)'};
  if(!map.numerodefactura)miss.push(labels.numerodefactura);
  if(!map.clientefacturado&&!map.emisorfactura&&!map.emisor)miss.push(labels.emisor);
  return miss;
}
function parseExcelFecha(vl){
  if(!vl)return '';
  if(typeof vl==='number'){
    const o=XLSX.SSF.parse_date_code(vl);
    if(!o)return '';
    const mm=String(o.m).padStart(2,'0');
    const dd=String(o.d).padStart(2,'0');
    return `${o.y}-${mm}-${dd}`;
  }
  const t=txt(String(vl));
  if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
  const m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(!m)return '';
  const y=m[3].length===2?`20${m[3]}`:m[3];
  return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}

/** Muchas hojas traen título en fila 1; los encabezados reales están después. */
function facturaRowToHeaderKeys(headerRow){
  const o={};
  (headerRow||[]).forEach(cell=>{
    const k=txt(String(cell));
    if(k)o[k]='';
  });
  return o;
}
function facturaMatrixToDataRows(headerIdx,matrix){
  const hdr=(matrix[headerIdx]||[]).map(c=>txt(String(c)));
  const rows=[];
  for(let r=headerIdx+1;r<matrix.length;r++){
    const line=matrix[r]||[];
    if(!line.some(c=>txt(String(c))!==''))continue;
    const obj={};
    hdr.forEach((h,j)=>{
      if(!h)return;
      const v=line[j];
      obj[h]=v===undefined||v===null?'':v;
    });
    rows.push(obj);
  }
  return rows;
}
function discoverFacturaTableInSheet(ws){
  const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  if(!matrix||!matrix.length)return null;
  const maxScan=Math.min(50,matrix.length);
  for(let i=0;i<maxScan;i++){
    const hdrObj=facturaRowToHeaderKeys(matrix[i]);
    if(Object.keys(hdrObj).length<2)continue;
    const m=resolveFacImportColumnMap(hdrObj);
    if(validateFacImportMap(m).length===0){
      const rows=facturaMatrixToDataRows(i,matrix);
      return{headerRowIndex:i,map:m,rows};
    }
  }
  return null;
}
function importarFacturasExcel(ev){
  const file=ev?.target?.files?.[0];
  if(!file)return;
  if(typeof XLSX==='undefined'){toast('⚠ Cargando librería, intenta en unos segundos...');return;}
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      let rows=null,map=null,usedSheet='';
      for(const name of wb.SheetNames){
        const disc=discoverFacturaTableInSheet(wb.Sheets[name]);
        if(disc&&disc.rows.length){rows=disc.rows;map=disc.map;usedSheet=name;break;}
      }
      if(!rows||!map){
        let discOnly=null;
        for(const name of wb.SheetNames){
          const disc=discoverFacturaTableInSheet(wb.Sheets[name]);
          if(disc){discOnly=disc;usedSheet=name;break;}
        }
        if(discOnly&&!discOnly.rows.length){
          toast(`Hay encabezados válidos en la fila ${discOnly.headerRowIndex+1} de «${usedSheet}», pero no hay filas de datos debajo.`,5200);
          return;
        }
        const firstName=wb.SheetNames[0];
        const matrix=firstName?XLSX.utils.sheet_to_json(wb.Sheets[firstName],{header:1,defval:''}):[];
        const peek=matrix&&matrix.length?facturaRowToHeaderKeys(matrix[0]):{};
        const peek2=matrix&&matrix.length>1?facturaRowToHeaderKeys(matrix[1]):{};
        const miss=validateFacImportMap(resolveFacImportColumnMap(peek));
        const cols1=Object.keys(peek).filter(Boolean).slice(0,12).join(', ');
        const cols2=Object.keys(peek2).filter(Boolean).slice(0,12).join(', ');
        toast(`No encontré la fila de columnas (No. Factura, Cliente, etc.). Si la fila 1 es un título, los encabezados deben ir abajo.${miss.length?' Falta: '+miss.join(' · ')+'.':''}${cols1?' Ej. fila 1: '+cols1+'.':''}${cols2?' Fila 2: '+cols2+'.':''}`,6200);
        return;
      }
      const groups={};
      rows.forEach(raw=>{
        const num=txt(facCell(raw,map,'numerodefactura'));
        if(!num)return;
        const clienteFacturadoRow=txt(facCell(raw,map,'clientefacturado')||facCell(raw,map,'emisor'));
        const emisorFacturaRow=txt(facCell(raw,map,'emisorfactura')||'');
        const fechaRow=parseExcelFecha(facCell(raw,map,'fecha'));
        const cantidad=money(facCell(raw,map,'cantidad'));
        const precioUnitario=money(facCell(raw,map,'preciounitario'));
        const totalPartida=money(facCell(raw,map,'totalpartida'))||(cantidad*precioUnitario);
        const concepto=txt(facCell(raw,map,'conceptoproductoservicio'));
        const tFactRow=money(facCell(raw,map,'totalfacturado'));
        if(!groups[num])groups[num]={
          id:uid(),
          numFactura:num,
          clienteFacturado:clienteFacturadoRow,
          emisorFactura:emisorFacturaRow,
          emisor:emisorFacturaRow,
          fecha:fechaRow,
          partidas:[],
          totalFacturado:tFactRow,
          creado:today()
        };
        const g=groups[num];
        if(!g.clienteFacturado&&clienteFacturadoRow)g.clienteFacturado=clienteFacturadoRow;
        if(!g.emisorFactura&&emisorFacturaRow)g.emisorFactura=emisorFacturaRow;
        if(!g.emisor&&emisorFacturaRow)g.emisor=emisorFacturaRow;
        if(!g.fecha&&fechaRow)g.fecha=fechaRow;
        if(concepto||cantidad||precioUnitario)g.partidas.push({concepto,cantidad,precioUnitario,total:totalPartida});
        if(tFactRow>0)g.totalFacturado=tFactRow;
      });
      const facturas=Object.values(groups).filter(f=>f.numFactura);
      if(!facturas.length){toast('No se encontró "Número de factura" en el Excel');return;}
      let n=0;
      facturas.forEach(f=>{
        if(!f.partidas.length)f.partidas=[{concepto:'',cantidad:0,precioUnitario:0,total:0}];
        if(!money(f.totalFacturado))f.totalFacturado=f.partidas.reduce((s,p)=>s+money(p.total),0);
        addUnique(db.cfg.clientesFactura,f.clienteFacturado);
        addUnique(db.cfg.razonesSociales,f.emisorFactura||f.emisor);
        addUnique(db.cfg.emisoresFactura,f.emisorFactura||f.emisor);
        (f.partidas||[]).forEach(p=>addUnique(db.cfg.conceptosFactura,p.concepto));
        const ix=(db.F||[]).findIndex(x=>norm(x.numFactura)===norm(f.numFactura));
        if(ix>=0)db.F[ix]={...db.F[ix],...f,id:db.F[ix].id};
        else db.F.push(f);
        n++;
      });
      save();
      render();
      toast(`✓ ${n} factura(s) importada(s)`);
    }catch(err){
      console.warn(err);
      toast('No se pudo importar el archivo Excel');
    }finally{
      if(ev?.target)ev.target.value='';
    }
  };
  rd.readAsArrayBuffer(file);
}
function autocompletarComisionDesdeFactura(kId){
  const k=db.K.find(x=>x.id===kId);if(!k)return;
  const nfacEl=v('km-nfac');
  const num=txt(nfacEl?.value||'');
  const opt=nfacEl?.selectedOptions?.[0]||null;
  const fid=txt(opt?.dataset?.fid||'');
  const fechaOpt=txt(opt?.dataset?.fecha||'');
  const emisorOpt=txt(opt?.dataset?.emisor||'');
  const montoOpt=money(opt?.dataset?.monto||0);
  const fechaEl=v('km-ffac');
  const montoEl=v('km-mfac');
  const rzonEl=v('km-rzon');
  if(!num){
    hintFacturaComisionMatch('',null);
    bloquearCamposFacturaComision(false);
    if(fechaEl)fechaEl.value='';
    if(montoEl)montoEl.value='0';
    if(rzonEl)rzonEl.value='';
    capturarDraftComision(k);
    previewComision(kId);
    return;
  }
  const f=(db.F||[]).find(x=>txt(x.id)===fid)||facturaByNumero(num);
  const hayDatosSelect=!!(fechaOpt||emisorOpt||montoOpt);
  hintFacturaComisionMatch(num,f||(hayDatosSelect?{numFactura:num}:null));
  if(!f&&!hayDatosSelect){
    bloquearCamposFacturaComision(false);
    if(fechaEl)fechaEl.value='';
    if(montoEl)montoEl.value='0';
    if(rzonEl)rzonEl.value='';
    capturarDraftComision(k);
    previewComision(kId);
    return;
  }
  bloquearCamposFacturaComision(true);
  // Fecha de Factura
  const fecha=fechaInputISO(fechaOpt||f?.fecha||'');
  if(fechaEl)fechaEl.value=fecha;
  // Monto Facturado (totalFacturado registrado en Facturación)
  if(montoEl){
    const monto=hayDatosSelect?montoOpt:(money(f?.totalFacturado)||facturaTotal(f));
    montoEl.value=String(monto||0);
  }
  // Emisor de Factura
  const em=txt(hayDatosSelect?emisorOpt:(f?.emisor||''));
  if(rzonEl){
    if(em){
      addUnique(db.cfg.razonesSociales,em);
      addUnique(db.cfg.emisoresFactura,em);
      const opt=[...rzonEl.options].find(o=>norm(o.value)===norm(em));
      if(!opt){const o=document.createElement('option');o.value=em;o.textContent=em;rzonEl.appendChild(o);}
    }
    rzonEl.value=em;
  }
  capturarDraftComision(k);
  previewComision(kId);
}

  const show=sel&&sel.value===ACT_OTHER_VALUE;

function leerTipoActividad(prefix){
  const sel=v(`${prefix}-tipo`);
  const val=sel?sel.value:'0';
  if(val===ACT_OTHER_VALUE){
    const inp=v(`${prefix}-tipo-otro`);
    const otro=txt(inp?.value||'');
    if(!setInvalid(inp,!otro)){toast('Define la otra actividad');return null;}
    db.cfg.atyp=activityTypes();
    const otraIdx=db.cfg.atyp.findIndex(t=>norm(t)===norm(ACT_OTHER));
    if(norm(otro)!==norm(ACT_OTHER)&&!db.cfg.atyp.some(t=>norm(t)===norm(otro)))db.cfg.atyp.push(otro);
    return{tipo:otraIdx>=0?otraIdx:0,tipoOtro:otro};
  }
  return{tipo:parseInt(val,10)||0,tipoOtro:''};
}
function filtrarSelect(selectId,query){
  const sel=v(selectId);if(!sel)return;
  const q=norm(query);
  [...sel.options].forEach(opt=>{
    const especial=!opt.value||String(opt.value).startsWith('__');
    const visible=!q||especial||opt.selected||norm(opt.textContent).includes(q);
    opt.hidden=!visible;
    opt.style.display=visible?'':'none';
  });
}

function saveCot(){
  const cliId=v('qn-cli').value;
  if(!setInvalid(v('qn-cli'),!cliId)){toast('Selecciona un cliente para la cotización');return;}
  const items=[];
  document.querySelectorAll('.qi').forEach(r=>{
    const d=txt(r.querySelector('.qi-d').value),q=intn(r.querySelector('.qi-q').value,1),p=money(r.querySelector('.qi-p').value);

  if(items.length===0){toast('Agrega al menos un concepto');return;}
  let oppId=v('qn-opp').value;
  const c=byId(db.C,cliId);
  if(!oppId){
    const autoOpp={id:uid(),cliId,titulo:`Cotización ${getVal('qn-num')||today()}`,servicio:(c&&c.servicio)||items[0].desc,valor:items.reduce((s,i)=>s+money(i.qty)*money(i.precio),0),etapa:2,creado:today()};
    db.O.push(autoOpp);
    oppId=autoOpp.id;
  }
  const q={id:uid(),cliId,oppId,num:getVal('qn-num'),fecha:getVal('qn-fch')||today(),contacto:getVal('qn-contacto'),puesto:getVal('qn-puesto'),items,estado:'borrador'};

let deferredPrompt = null;
const enModoApp=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
function mostrarBotonInstalar(modoManual=false) {
  if (enModoApp() || document.getElementById('btn-instalar')) return;
  const navBar = document.getElementById('nav-bar');
  if (!navBar) return;
  const btn = document.createElement('button');
  btn.id = 'btn-instalar';
  btn.className = 'bp';
  btn.innerHTML = '📲 Instalar App';
  btn.title = modoManual ? 'Instalar desde el menú del navegador' : 'Instalar CRM Industrial';
  btn.style.cssText = 'background:#eaf3de;color:#3b6d11;border-color:#a8d580;';
  btn.onclick = async () => {
    if (!deferredPrompt) {
      toast('Si no aparece el aviso, usa el menú del navegador y elige "Instalar app" o "Agregar a pantalla principal".', 5200);
      return;
    }
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice.outcome === 'accepted') toast('✓ App instalada');
    btn.remove();
    deferredPrompt = null;
  };
  navBar.appendChild(btn);
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  mostrarBotonInstalar();
});

window.addEventListener('load', () => {
  setTimeout(() => {
    if (!deferredPrompt) mostrarBotonInstalar(true);
  }, 1200);
});

window.addEventListener('appinstalled', () => {
  toast('✓ CRM Industrial instalado en tu dispositivo');
  const btn = document.getElementById('btn-instalar');
  if (btn) btn.remove();
  deferredPrompt = null;
});
</script>
